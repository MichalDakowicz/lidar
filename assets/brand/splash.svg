    <path d="M616.5 855 A250 250 0 0 1 1049.5 855"/>
    <path d="M495.3 785 A390 390 0 0 1 1170.7 785"/>
    <path d="M374 715 A530 530 0 0 1 1292 715"/>
  </g>
  <g fill="#8B5CF6" stroke="#8B5CF6" stroke-width="46" stroke-linejoin="round">
    <path d="M803 1035 L380 955 L380 1335 L803 1415 Z"/>
    <path d="M863 1035 L1286 955 L1286 1335 L863 1415 Z"/>
  </g>
</svg>
